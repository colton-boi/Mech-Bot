[workspace]
resolver = "2"
members = ["crates/proto", "crates/world", "crates/policy", "crates/bot"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
proto = { path = "crates/proto" }
world = { path = "crates/world" }
policy = { path = "crates/policy" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
